<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Azuos Env — Automações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t-dark{color-scheme:dark;--paper:11 7 20;--paper-2:16 11 28;--surface:20 16 31;--surface-2:28 22 43;--line:44 36 62;--ink:245 243 249;--body:194 186 210;--muted:156 147 173;--accent:167 139 250;--signal:205 190 255;--signal-2:167 139 250;--on-signal:22 10 46;--scene:33 19 66;--scene-line:72 50 124;--dot:167 139 250;--success:34 197 94;--warning:245 158 11;--danger:239 68 68;--info:96 165 250}
.t-light{color-scheme:light;--paper:248 246 252;--paper-2:240 236 249;--surface:255 255 255;--surface-2:245 241 252;--line:224 217 238;--ink:22 14 38;--body:72 63 94;--muted:101 92 122;--accent:109 40 217;--signal:139 92 246;--signal-2:109 40 217;--on-signal:255 255 255;--scene:236 228 255;--scene-line:212 198 250;--dot:124 58 237;--success:22 163 74;--warning:217 119 6;--danger:220 38 38;--info:37 99 235}
.app{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:rgb(var(--paper));color:rgb(var(--ink));scrollbar-color:rgb(var(--line)) rgb(var(--paper))}
.app button,.app input,.app select{font:inherit;color:inherit}
.app button{cursor:pointer}
.app ::selection{background:rgb(var(--accent) / .35);color:rgb(var(--ink))}
.app :focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
a{color:rgb(var(--accent))}a:hover{color:rgb(var(--signal))}
.btn-signal{background-image:linear-gradient(100deg,rgb(var(--signal)) 0%,rgb(var(--signal-2)) 100%);color:rgb(var(--on-signal));box-shadow:0 10px 30px -12px rgb(var(--signal-2) / .7);border:0}
.ghost{background:transparent;border:1px solid rgb(var(--line));color:rgb(var(--body))}
.ghost:hover{background:rgb(var(--surface-2));color:rgb(var(--ink))}
.nb{background:transparent;border:0;color:rgb(var(--muted))}
.nb:hover{background:rgb(var(--surface-2));color:rgb(var(--ink))}
.card{background:rgb(var(--surface));border:1px solid rgb(var(--line))}
.heading{font-weight:600;letter-spacing:-0.02em;line-height:1.02;color:rgb(var(--ink))}
.sel{height:40px;border-radius:8px;border:1px solid rgb(var(--line));background:rgb(var(--paper));padding:0 10px;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="app {{themeClass}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch;">

<nav aria-label="Navegação global" style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; background: rgb(var(--paper-2)); border-right: 1px solid rgb(var(--line)); box-sizing: border-box;">
<a href="Main.dc.html" class="btn-signal" aria-label="Azuos Env — início" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-bottom: 10px; text-decoration: none;">&lt;/&gt;</a>
<sc-for list="{{gnav}}" as="g" hint-placeholder-count="10">
<a class="nb" href="{{g.href}}" aria-label="{{g.label}}" title="{{g.label}}" aria-current="{{g.current}}" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{g.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"></path></svg>
</a>
</sc-for>
<span style="flex: 1;"></span>
<a class="nb" href="Configuracoes.dc.html" aria-label="Configurações" title="Configurações" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{settingsStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{gearIcon}}"></path></svg>
</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid rgb(var(--line));">
<h1 class="heading" style="margin: 0; font-size: 24px;">Automações</h1>
<span style="font-size: 11.5px; color: rgb(var(--muted)); border: 1px solid rgb(var(--line)); border-radius: 999px; padding: 2px 8px;">Dados de exemplo</span>
<span style="flex: 1;"></span>
<button class="btn-signal" onClick="{{openBuilder}}" style="height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600;">+ Nova automação</button>
<button class="ghost" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<div role="img" aria-label="Felipe de Souza" style="width: 36px; height: 36px; border-radius: 50%; background: rgb(var(--scene)); border: 1px solid rgb(var(--scene-line)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">FS</div>
</header>

<div style="padding: 16px 24px 0; display: flex; gap: 4px; border-bottom: 1px solid rgb(var(--line));">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
<button onClick="{{tb.pick}}" aria-pressed="{{tb.pressed}}" style="height: 40px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; {{tb.style}}">{{tb.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 24px 40px; align-items: flex-start;">
<sc-if value="{{isRules}}" hint-placeholder-val="{{true}}">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
<div class="card" style="border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; {{r.dim}}">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: rgb(var(--muted));">QUANDO</span>
<span style="font-weight: 600;">{{r.when}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: rgb(var(--accent));">ENTÃO</span>
<span style="color: rgb(var(--body));">{{r.then}}</span>
</div>
<span style="font-size: 12px; color: rgb(var(--muted));">{{r.scope}} · {{r.last}}</span>
</div>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
<input type="checkbox" role="switch" checked="{{r.on}}" onChange="{{r.toggle}}" style="width: 40px; height: 22px; margin: 0; accent-color: rgb(var(--accent));">
<span style="font-size: 13px; min-width: 52px; color: rgb(var(--body));">{{r.state}}</span>
</label>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isLog}}" hint-placeholder-val="{{false}}">
<div style="flex: 999 1 520px; min-width: 0; overflow-x: auto; border: 1px solid rgb(var(--line)); border-radius: 12px;">
<table style="border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px;">
<thead><tr style="background: rgb(var(--surface-2)); text-align: left;">
<th style="padding: 10px 12px; font-size: 12px; color: rgb(var(--muted));">Quando</th>
<th style="padding: 10px 12px; font-size: 12px; color: rgb(var(--muted));">Automação</th>
<th style="padding: 10px 12px; font-size: 12px; color: rgb(var(--muted));">Alvo</th>
<th style="padding: 10px 12px; font-size: 12px; color: rgb(var(--muted));">Resultado</th>
</tr></thead>
<tbody>
<sc-for list="{{log}}" as="l" hint-placeholder-count="5">
<tr style="border-top: 1px solid rgb(var(--line));">
<td style="padding: 12px; color: rgb(var(--muted)); white-space: nowrap;">{{l.when}}</td>
<td style="padding: 12px;">{{l.rule}}</td>
<td style="padding: 12px; color: rgb(var(--body));">{{l.target}}</td>
<td style="padding: 12px;"><span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgb({{l.tone}} / 0.16); color: rgb({{l.tone}});">{{l.result}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</sc-if>

<sc-if value="{{builder}}" hint-placeholder-val="{{false}}">
<aside aria-label="Nova automação" class="card" style="flex: 1 1 300px; max-width: 380px; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">Nova automação</h2>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="loc" style="font-size: 12.5px; color: rgb(var(--muted));">Onde</label>
<select id="loc" class="sel" value="{{form.loc}}" onChange="{{form.setLoc}}"><option>Workspace inteiro</option><option>Space Clientes</option><option>Space Produtos</option><option>Comercial / Leads</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="trig" style="font-size: 12.5px; color: rgb(var(--muted));">Quando (gatilho)</label>
<select id="trig" class="sel" value="{{form.trig}}" onChange="{{form.setTrig}}"><option>Tarefa criada</option><option>Status muda para Code review</option><option>Prazo vence</option><option>Todas as subtarefas concluídas</option><option>Formulário enviado</option><option>Todo dia às 08:00</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="act" style="font-size: 12.5px; color: rgb(var(--muted));">Então (ação)</label>
<select id="act" class="sel" value="{{form.act}}" onChange="{{form.setAct}}"><option>Atribuir a Ezequiel Santos</option><option>Atribuir a Felipe de Souza</option><option>Mudar prioridade para Urgente</option><option>Notificar responsável</option><option>Mover para outra List</option><option>Aplicar template</option></select>
</div>
<div style="display: flex; gap: 8px; justify-content: flex-end;">
<button class="ghost" onClick="{{closeBuilder}}" style="height: 38px; padding: 0 14px; border-radius: 8px;">Cancelar</button>
<button class="btn-signal" onClick="{{save}}" style="height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600;">Salvar e ativar</button>
</div>
</aside>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  shell(active) {
    const self = this;
    const s = this.state || {};
    let stored = null;
    try { stored = window.localStorage.getItem('azuos-theme'); } catch (e) {}
    const theme = s.theme || stored || (this.props.tema === 'claro' ? 'light' : 'dark');
    const NAV = [
      ['tarefas', 'Tarefas', 'Main.dc.html', 'M9 11l3 3 8-8M20 12v7H4V5h11'],
      ['planner', 'Planner', 'Planner.dc.html', 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4'],
      ['chat', 'Chat', 'Chat.dc.html', 'M4 5h16v11H9l-5 4z'],
      ['docs', 'Docs', 'Docs.dc.html', 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7'],
      ['dash', 'Dashboards', 'Dashboards.dc.html', 'M4 20V10M10 20V4M16 20v-7M2 20h20'],
      ['time', 'Timesheets', 'Timesheets.dc.html', 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],
      ['metas', 'Metas', 'Metas.dc.html', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z'],
      ['auto', 'Automações', 'Automacoes.dc.html', 'M13 2 4 14h7l-1 8 9-12h-7z'],
      ['wb', 'Whiteboard', 'Whiteboard.dc.html', 'M3 4h18v12H3zM8 20l4-4 4 4'],
      ['ia', 'IA', 'IA.dc.html', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z']
    ];
    const on = 'background: rgb(var(--accent) / 0.16); color: rgb(var(--ink));';
    return {
      themeClass: theme === 'light' ? 't-light' : 't-dark',
      themeIcon: theme === 'light' ? 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z' : 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      themeLabel: theme === 'light' ? 'Mudar para tema escuro' : 'Mudar para tema claro',
      toggleTheme: () => { const n = theme === 'light' ? 'dark' : 'light'; try { window.localStorage.setItem('azuos-theme', n); } catch (e) {} self.setState({ theme: n }); },
      gnav: NAV.map(i => ({ label: i[1], href: i[2], d: i[3], current: i[0] === active ? 'page' : 'false', style: i[0] === active ? on : '' })),
      settingsStyle: active === 'config' ? on : '',
      gearIcon: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'
    };
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const tab = s.tab || 'rules';
    const rules = s.rules || [
      { id: 1, when: 'Status muda para Code review', then: 'Atribuir revisor: Ezequiel Santos', scope: 'Space Clientes', last: 'última execução hoje, 09:12', on: true },
      { id: 2, when: 'Todas as subtarefas concluídas', then: 'Mudar status da tarefa para Teste', scope: 'Space Produtos', last: 'última execução ontem', on: true },
      { id: 3, when: 'Prazo vence', then: 'Notificar responsável e mudar prioridade para Urgente', scope: 'Workspace inteiro', last: 'última execução hoje, 00:00', on: true },
      { id: 4, when: 'Formulário da landing page enviado', then: 'Criar tarefa em Comercial / Leads', scope: 'Comercial / Leads', last: 'última execução hoje, 08:38', on: true },
      { id: 5, when: 'PR do GitHub mesclado', then: 'Mover para Deploy e comentar com o link do PR', scope: 'Space Clientes', last: 'integração GitHub não conectada', on: false },
      { id: 6, when: 'Todo dia às 08:00', then: 'Enviar resumo do dia para o Inbox de cada membro', scope: 'Workspace inteiro', last: 'última execução hoje, 08:00', on: true }
    ];
    const form = s.form || { loc: 'Space Clientes', trig: 'Tarefa criada', act: 'Atribuir a Felipe de Souza' };
    const setF = (k) => (e) => { const v = e.target.value; self.setState({ form: Object.assign({}, form, { [k]: v }) }); };
    const tabBtn = (id, label) => ({
      label: label, pressed: tab === id ? 'true' : 'false',
      style: tab === id ? 'border-bottom-color: rgb(var(--accent)); color: rgb(var(--ink)); font-weight: 600;' : 'color: rgb(var(--muted));',
      pick: () => self.setState({ tab: id })
    });
    return Object.assign(this.shell('auto'), {
      tabs: [tabBtn('rules', 'Regras · ' + rules.filter(r => r.on).length + ' ativas'), tabBtn('log', 'Histórico de execuções')],
      isRules: tab === 'rules', isLog: tab === 'log',
      rules: rules.map(r => ({
        when: r.when, then: r.then, scope: r.scope, last: r.last, on: r.on,
        state: r.on ? 'Ativa' : 'Pausada', dim: r.on ? '' : 'opacity: 0.7;',
        toggle: () => self.setState({ rules: rules.map(x => x.id === r.id ? Object.assign({}, x, { on: !x.on }) : x) })
      })),
      log: [
        { when: 'hoje, 09:12', rule: 'Status → Code review', target: 'AZD-143 Sincronização PouchDB ↔ CouchDB', result: 'Sucesso', tone: 'var(--success)' },
        { when: 'hoje, 08:38', rule: 'Formulário da landing page', target: 'Lead: loja de autopeças', result: 'Sucesso', tone: 'var(--success)' },
        { when: 'hoje, 08:00', rule: 'Resumo diário', target: '2 membros', result: 'Sucesso', tone: 'var(--success)' },
        { when: 'hoje, 00:00', rule: 'Prazo vence', target: 'AZD-143', result: 'Sucesso', tone: 'var(--success)' },
        { when: 'ontem, 18:02', rule: 'PR do GitHub mesclado', target: 'AZD-147', result: 'Erro: integração', tone: 'var(--danger)' }
      ],
      builder: !!s.builder,
      openBuilder: () => self.setState({ builder: true, tab: 'rules' }),
      closeBuilder: () => self.setState({ builder: false }),
      form: { loc: form.loc, trig: form.trig, act: form.act, setLoc: setF('loc'), setTrig: setF('trig'), setAct: setF('act') },
      save: () => self.setState({ builder: false, rules: rules.concat([{ id: Date.now(), when: form.trig, then: form.act, scope: form.loc, last: 'criada agora', on: true }]) })
    });
  }
}
</script>
</body>
</html>
