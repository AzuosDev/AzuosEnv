<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Azuos Env — Whiteboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t-dark{color-scheme:dark;--paper:11 7 20;--paper-2:16 11 28;--surface:20 16 31;--surface-2:28 22 43;--line:44 36 62;--ink:245 243 249;--body:194 186 210;--muted:156 147 173;--accent:167 139 250;--signal:205 190 255;--signal-2:167 139 250;--on-signal:22 10 46;--scene:33 19 66;--scene-line:72 50 124;--dot:167 139 250;--success:34 197 94;--warning:245 158 11;--danger:239 68 68;--info:96 165 250}
.t-light{color-scheme:light;--paper:248 246 252;--paper-2:240 236 249;--surface:255 255 255;--surface-2:245 241 252;--line:224 217 238;--ink:22 14 38;--body:72 63 94;--muted:101 92 122;--accent:109 40 217;--signal:139 92 246;--signal-2:109 40 217;--on-signal:255 255 255;--scene:236 228 255;--scene-line:212 198 250;--dot:124 58 237;--success:22 163 74;--warning:217 119 6;--danger:220 38 38;--info:37 99 235}
.app{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:rgb(var(--paper));color:rgb(var(--ink));scrollbar-color:rgb(var(--line)) rgb(var(--paper))}
.app button,.app textarea{font:inherit;color:inherit}
.app button{cursor:pointer}
.app ::selection{background:rgb(var(--accent) / .35);color:rgb(var(--ink))}
.app textarea{caret-color:rgb(var(--accent))}
.app :focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
a{color:rgb(var(--accent))}a:hover{color:rgb(var(--signal))}
.btn-signal{background-image:linear-gradient(100deg,rgb(var(--signal)) 0%,rgb(var(--signal-2)) 100%);color:rgb(var(--on-signal));box-shadow:0 10px 30px -12px rgb(var(--signal-2) / .7);border:0}
.ghost{background:transparent;border:1px solid rgb(var(--line));color:rgb(var(--body))}
.ghost:hover{background:rgb(var(--surface-2));color:rgb(var(--ink))}
.nb{background:transparent;border:0;color:rgb(var(--muted))}
.nb:hover{background:rgb(var(--surface-2));color:rgb(var(--ink))}
.card{background:rgb(var(--surface));border:1px solid rgb(var(--line))}
.dot-grid{background-image:radial-gradient(rgb(var(--dot) / .22) 1px,transparent 1.2px);background-size:14px 14px}
.heading{font-weight:600;letter-spacing:-0.02em;line-height:1.02;color:rgb(var(--ink))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="app {{themeClass}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch;">

<nav aria-label="Navegação global" style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; background: rgb(var(--paper-2)); border-right: 1px solid rgb(var(--line)); box-sizing: border-box;">
<a href="Main.dc.html" class="btn-signal" aria-label="Azuos Env — início" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-bottom: 10px; text-decoration: none;">&lt;/&gt;</a>
<sc-for list="{{gnav}}" as="g" hint-placeholder-count="10">
<a class="nb" href="{{g.href}}" aria-label="{{g.label}}" title="{{g.label}}" aria-current="{{g.current}}" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{g.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"></path></svg>
</a>
</sc-for>
<span style="flex: 1;"></span>
<a class="nb" href="Configuracoes.dc.html" aria-label="Configurações" title="Configurações" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{settingsStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{gearIcon}}"></path></svg>
</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid rgb(var(--line));">
<h1 class="heading" style="margin: 0; font-size: 22px;">Brainstorm · Azuos Env v2</h1>
<span style="font-size: 11.5px; color: rgb(var(--muted)); border: 1px solid rgb(var(--line)); border-radius: 999px; padding: 2px 8px;">Exemplo</span>
<span style="flex: 1;"></span>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgb(var(--muted));">
<span style="width: 28px; height: 28px; border-radius: 50%; background: rgb(var(--scene)); border: 2px solid rgb(var(--accent)); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: rgb(var(--ink));">ES</span>
Ezequiel está editando
</div>
<button class="btn-signal" style="height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 600;">Compartilhar</button>
<button class="ghost" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
<div role="img" aria-label="Felipe de Souza" style="width: 36px; height: 36px; border-radius: 50%; background: rgb(var(--scene)); border: 1px solid rgb(var(--scene-line)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">FS</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 24px 32px; align-items: flex-start;">
<div role="toolbar" aria-label="Ferramentas" style="flex: 0 0 56px; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 14px; background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); box-sizing: border-box;">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" aria-label="{{t.label}}" title="{{t.label}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; display: flex; align-items: center; justify-content: center; {{t.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
</button>
</sc-for>
</div>

<div style="flex: 999 1 600px; min-width: 0; overflow: auto; border-radius: 16px; border: 1px solid rgb(var(--line));">
<div class="dot-grid" style="position: relative; width: 880px; height: 640px; background-color: rgb(var(--surface));">
<span style="position: absolute; left: 40px; top: 24px; font-weight: 600; font-size: 15px;">Ideias</span>
<span style="position: absolute; left: 320px; top: 24px; font-weight: 600; font-size: 15px;">Problemas</span>
<span style="position: absolute; left: 600px; top: 24px; font-weight: 600; font-size: 15px;">Próximos passos</span>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="7">
<button onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="position: absolute; width: 220px; min-height: 120px; box-sizing: border-box; padding: 14px; border-radius: 6px; text-align: left; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 20px -14px rgb(0 0 0 / .6); {{n.style}}">
<span style="font-weight: 500; line-height: 1.4; color: rgb(var(--ink));">{{n.text}}</span>
<sc-if value="{{n.converted}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgb(var(--success) / 0.2); color: rgb(var(--ink)); align-self: flex-start;">{{n.task}}</span></sc-if>
<span style="font-size: 11px; color: rgb(var(--body)); margin-top: auto;">{{n.author}}</span>
</button>
</sc-for>
</div>
</div>

<aside aria-label="Item selecionado" class="card" style="flex: 1 1 260px; max-width: 300px; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px;">
<span style="font-size: 12px; font-weight: 600; color: rgb(var(--muted)); text-transform: uppercase; letter-spacing: .06em;">Nota selecionada</span>
<label for="txt" class="sr">Texto da nota</label>
<textarea id="txt" rows="4" value="{{sel.text}}" onInput="{{sel.edit}}" style="border-radius: 10px; border: 1px solid rgb(var(--line)); background: rgb(var(--paper)); padding: 10px 12px; resize: vertical;"></textarea>
<div style="display: flex; gap: 8px;" role="group" aria-label="Cor da nota">
<sc-for list="{{sel.colors}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" style="width: 32px; height: 32px; border-radius: 8px; {{c.style}}"></button>
</sc-for>
</div>
<button class="btn-signal" onClick="{{sel.convert}}" disabled="{{sel.converted}}" style="height: 40px; border-radius: 10px; font-weight: 600;">{{sel.convertLabel}}</button>
<button class="ghost" onClick="{{sel.remove}}" style="height: 36px; border-radius: 8px;">Excluir nota</button>
</div>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-weight: 600;">Nada selecionado</span>
<span style="font-size: 13px; color: rgb(var(--body)); line-height: 1.5;">Clique numa nota para editar, mudar a cor ou transformá-la em tarefa. Use a ferramenta Nota para adicionar.</span>
<button class="btn-signal" onClick="{{addNote}}" style="height: 40px; border-radius: 10px; font-weight: 600;">+ Nota</button>
</div>
</sc-if>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  shell(active) {
    const self = this;
    const s = this.state || {};
    let stored = null;
    try { stored = window.localStorage.getItem('azuos-theme'); } catch (e) {}
    const theme = s.theme || stored || (this.props.tema === 'claro' ? 'light' : 'dark');
    const NAV = [
      ['tarefas', 'Tarefas', 'Main.dc.html', 'M9 11l3 3 8-8M20 12v7H4V5h11'],
      ['planner', 'Planner', 'Planner.dc.html', 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4'],
      ['chat', 'Chat', 'Chat.dc.html', 'M4 5h16v11H9l-5 4z'],
      ['docs', 'Docs', 'Docs.dc.html', 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7'],
      ['dash', 'Dashboards', 'Dashboards.dc.html', 'M4 20V10M10 20V4M16 20v-7M2 20h20'],
      ['time', 'Timesheets', 'Timesheets.dc.html', 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],
      ['metas', 'Metas', 'Metas.dc.html', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z'],
      ['auto', 'Automações', 'Automacoes.dc.html', 'M13 2 4 14h7l-1 8 9-12h-7z'],
      ['wb', 'Whiteboard', 'Whiteboard.dc.html', 'M3 4h18v12H3zM8 20l4-4 4 4'],
      ['ia', 'IA', 'IA.dc.html', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z']
    ];
    const on = 'background: rgb(var(--accent) / 0.16); color: rgb(var(--ink));';
    return {
      themeClass: theme === 'light' ? 't-light' : 't-dark',
      themeIcon: theme === 'light' ? 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z' : 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      themeLabel: theme === 'light' ? 'Mudar para tema escuro' : 'Mudar para tema claro',
      toggleTheme: () => { const n = theme === 'light' ? 'dark' : 'light'; try { window.localStorage.setItem('azuos-theme', n); } catch (e) {} self.setState({ theme: n }); },
      gnav: NAV.map(i => ({ label: i[1], href: i[2], d: i[3], current: i[0] === active ? 'page' : 'false', style: i[0] === active ? on : '' })),
      settingsStyle: active === 'config' ? on : '',
      gearIcon: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'
    };
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const notes = s.notes || [
      { id: 1, x: 40, y: 64, c: 'accent', t: 'Portal do cliente com homologação dentro do sistema', a: 'Felipe' },
      { id: 2, x: 40, y: 212, c: 'accent', t: 'Lead da landing page cai direto em Comercial / Leads', a: 'Ezequiel' },
      { id: 3, x: 40, y: 360, c: 'accent', t: 'PR mesclado no GitHub move a tarefa para Deploy', a: 'Felipe' },
      { id: 4, x: 320, y: 64, c: 'warning', t: 'Horas faturáveis espalhadas em planilhas', a: 'Ezequiel' },
      { id: 5, x: 320, y: 212, c: 'warning', t: 'Cliente não enxerga o progresso do projeto', a: 'Felipe' },
      { id: 6, x: 600, y: 64, c: 'success', t: 'Validar o protótipo com a equipe', a: 'Felipe' },
      { id: 7, x: 600, y: 212, c: 'success', t: 'Escrever os prompts por fase', a: 'Felipe' }
    ];
    const sel = s.sel ?? null;
    const tool = s.tool || 'select';
    const conv = s.conv || {};
    const nextTask = s.nextTask || 152;
    const COLORS = [['accent', 'Roxo'], ['info', 'Azul'], ['warning', 'Âmbar'], ['success', 'Verde']];
    const upd = (id, fn) => self.setState({ notes: notes.map(n => n.id === id ? fn(n) : n) });
    const addNote = () => {
      const count = notes.filter(n => n.x === 40).length;
      const n = { id: Date.now(), x: 40, y: 64 + count * 148, c: 'accent', t: 'Nova ideia', a: 'Felipe' };
      self.setState({ notes: notes.concat([n]), sel: n.id, tool: 'select' });
    };
    const TOOLS = [
      ['select', 'Selecionar', 'M4 3l7 17 2.5-7.5L21 10z'],
      ['note', 'Nota adesiva', 'M4 4h16v10l-6 6H4zM14 20v-6h6'],
      ['text', 'Texto', 'M5 6V4h14v2M12 4v16M9 20h6'],
      ['shape', 'Forma', 'M4 4h16v16H4z'],
      ['line', 'Conector', 'M5 19L19 5M13 5h6v6']
    ];
    const cur = notes.find(n => n.id === sel);
    return Object.assign(this.shell('wb'), {
      tools: TOOLS.map(t => ({
        label: t[1], d: t[2], pressed: tool === t[0] ? 'true' : 'false',
        style: tool === t[0] ? 'background: rgb(var(--accent) / 0.18); color: rgb(var(--ink));' : 'background: transparent; color: rgb(var(--muted));',
        pick: () => { if (t[0] === 'note') addNote(); else self.setState({ tool: t[0] }); }
      })),
      notes: notes.map(n => ({
        text: n.t, author: n.a, pressed: n.id === sel ? 'true' : 'false',
        converted: !!conv[n.id], task: conv[n.id] ? 'AZD-' + conv[n.id] : '',
        style: 'left: ' + n.x + 'px; top: ' + n.y + 'px; background: rgb(var(--' + n.c + ') / 0.22); border: ' + (n.id === sel ? '2px solid rgb(var(--accent))' : '1px solid rgb(var(--' + n.c + ') / 0.45)') + ';',
        pick: () => self.setState({ sel: n.id })
      })),
      hasSel: !!cur, noSel: !cur,
      addNote: addNote,
      sel: cur ? {
        text: cur.t,
        edit: (e) => { const v = e.target.value; upd(cur.id, n => Object.assign({}, n, { t: v })); },
        colors: COLORS.map(c => ({
          label: 'Cor ' + c[1], pressed: cur.c === c[0] ? 'true' : 'false',
          style: 'background: rgb(var(--' + c[0] + ') / 0.4); border: ' + (cur.c === c[0] ? '2px solid rgb(var(--ink))' : '1px solid rgb(var(--line))') + ';',
          pick: () => upd(cur.id, n => Object.assign({}, n, { c: c[0] }))
        })),
        converted: !!conv[cur.id],
        convertLabel: conv[cur.id] ? 'Virou a tarefa AZD-' + conv[cur.id] : 'Converter em tarefa',
        convert: () => self.setState({ conv: Object.assign({}, conv, { [cur.id]: nextTask }), nextTask: nextTask + 1 }),
        remove: () => self.setState({ notes: notes.filter(n => n.id !== cur.id), sel: null })
      } : {}
    });
  }
}
</script>
</body>
</html>
